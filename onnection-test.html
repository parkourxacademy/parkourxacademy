
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PARKOUR X Connection Test</title>
</head>
<body style="font-family:Arial,sans-serif;padding:24px">
  <h2>PARKOUR X</h2>
  <p id="status">Testing connection...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    (async function () {
      const status = document.getElementById("status");

      try {
        if (!window.parkourSupabase) {
          throw new Error("Supabase client was not initialized.");
        }

        const { error } =
          await window.parkourSupabase.auth.getUser();

        if (error && error.name === "AuthSessionMissingError") {
          status.textContent =
            "Connection setup loaded. No user is signed in yet.";
          return;
        }

        if (error) throw error;

        status.textContent =
          "Supabase responded successfully.";
      } catch (error) {
        status.textContent =
          "Test failed: " + error.message;
      }
    })();
  </script>
</body>
</html>
